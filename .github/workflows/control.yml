package com.example.volumelock

import android.Manifest
import android.content.Intent
import android.content.pm.PackageManager
import android.os.Build
import android.os.Bundle
import android.view.Gravity
import android.widget.Button
import android.widget.LinearLayout
import android.widget.SeekBar
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import androidx.core.app.ActivityCompat
import androidx.core.content.ContextCompat

class MainActivity : AppCompatActivity() {

    private lateinit var label: TextView
    private lateinit var seek: SeekBar
    private lateinit var button: Button

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val prefs = getSharedPreferences("prefs", MODE_PRIVATE)
        var active = prefs.getBoolean("active", false)

        val pad = (24 * resources.displayMetrics.density).toInt()
        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(pad, pad, pad, pad)
        }

        label = TextView(this).apply { textSize = 22f; gravity = Gravity.CENTER }
        seek = SeekBar(this).apply { max = 100; progress = prefs.getInt("percent", 50) }
        button = Button(this)

        root.addView(label)
        root.addView(seek)
        root.addView(button)
        setContentView(root)

        fun refresh() {
            label.text = "Volume de mídia: ${seek.progress}%"
            button.text = if (active) "Desativar trava" else "Ativar trava"
        }
        refresh()

        seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(sb: SeekBar?, value: Int, fromUser: Boolean) {
                prefs.edit().putInt("percent", value).apply()
                refresh()
                // Se a trava já está ativa, reinicia o serviço com o novo valor
                if (active) startLock()
            }
            override fun onStartTrackingTouch(sb: SeekBar?) {}
            override fun onStopTrackingTouch(sb: SeekBar?) {}
        })

        button.setOnClickListener {
            active = !active
            prefs.edit().putBoolean("active", active).apply()
            if (active) {
                askNotificationPermission()
                startLock()
            } else {
                stopService(Intent(this, VolumeLockService::class.java))
            }
            refresh()
        }
    }

    private fun startLock() {
        ContextCompat.startForegroundService(this, Intent(this, VolumeLockService::class.java))
    }

    private fun askNotificationPermission() {
        if (Build.VERSION.SDK_INT >= 33 &&
            ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
            != PackageManager.PERMISSION_GRANTED
        ) {
            ActivityCompat.requestPermissions(
                this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1
            )
        }
    }
}
